[package]
name = "glfwtest"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = "1.25.0"
glow = "0.17.0"
freetype-rs = "0.38.0"
rustybuzz = "0.20.1"
winit = { version = "0.30.13", features = ["wayland"], default-features = false }
glutin = { version = "0.32.3", features = ["wayland"], default-features = false }
glutin-winit = {version = "0.5.0", features = ["wayland", "egl"], default-features = false }
bitflags = "2.11.0"
unicode-width = "0.2.2"

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1
